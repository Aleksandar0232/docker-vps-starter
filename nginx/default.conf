# nginx sits in front of the app ("reverse proxy").
# It receives every request on port 80 *inside its container*
# (published as 8080 on the server) and forwards it to the app.

upstream app_upstream {
    # "app" is resolved by Docker's built-in DNS. If you scale the app
    # (docker compose up -d --scale app=3), nginx spreads requests across
    # all copies after an nginx restart.
    server app:8000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;   # don't advertise the nginx version

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Used by the nginx container's healthcheck
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
